name: Import FlowForge Community v0.4.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-flowforge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify FlowForge source archive
        shell: bash
        env:
          ARCHIVE_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3KDJir3RhGWbUjBNuU7xr7bxBOj/a43112ea-5a64-4d28-a696-20288ca76298.zip
          EXPECTED_SHA256: c3b32ff9c319aaa4450d28b0f89d70965ca2b31d4497810be337da6a343bf7e0
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flowforge-community-v0.4.0.zip"
          extracted="$RUNNER_TEMP/flowforge-extracted"
          curl --fail --location --retry 3 --silent --show-error "$ARCHIVE_URL" -o "$archive"
          echo "$EXPECTED_SHA256  $archive" | sha256sum --check
          mkdir -p "$extracted"
          unzip -q "$archive" -d "$extracted"
          test -f "$extracted/flowforge-community/README.md"
          test -f "$extracted/flowforge-community/backend/flowforge/main.py"
          test -f "$extracted/flowforge-community/frontend/src/App.tsx"
          # The connected GitHub App lacks the workflows permission; import source without CI workflow files.
          rm -f "$extracted/flowforge-community/.github/workflows/"*.yml "$extracted/flowforge-community/.github/workflows/"*.yaml
          cp -a "$extracted/flowforge-community/." .
          rm -f .github/workflows/import-flowforge-v040.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add FlowForge Community v0.4.0"
          git push origin HEAD:main
